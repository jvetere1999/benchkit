; Developing Benchkit (no project needed):
;   pio run                    the demo for an Uno, and sketches using every class (all/, more/) for an Uno and a Mega
;                              (catches compile errors and shows the sizes)
;   pio test -e native         the logic tests, on the computer, no board
;   pio run -e demo -t upload  the demo onto an Uno: joystick, button and an ST7735 screen
[platformio]
default_envs = demo, all_uno, all_mega, more_uno, more_mega

[env]
lib_deps = symlink://../..   ; the library in this repo, not a downloaded copy

[avr]
platform = atmelavr
framework = arduino
monitor_speed = 115200
lib_deps =
  ${env.lib_deps}
  nrf24/RF24                 ; optional for Benchkit: Nrf24 is built when it's there
  adafruit/Adafruit NeoPixel ; optional: PixelRing likewise

[env:demo]
extends = avr
board = uno
build_src_filter = +<demo/>

[env:all_uno]
extends = avr
board = uno
build_src_filter = +<all/>

[env:all_mega]
extends = avr
board = megaatmega2560
build_src_filter = +<all/>

[env:more_uno]
extends = avr
board = uno
build_src_filter = +<more/>

[env:more_mega]
extends = avr
board = megaatmega2560
build_src_filter = +<more/>

; Native tests run against fakelib/ (a pretend Arduino: pins, analog values and time are
; variables the tests set), so they exercise each class's real code, not just its maths.
[env:native]
platform = native
lib_deps =
  symlink://fakelib/fake_arduino   ; first, so the library's #include <Arduino.h> finds it
  ${env.lib_deps}
  throwtheswitch/Unity@^2.6.0   ; listed by hand: with lib_compat_mode off the test runner doesn't add it
test_framework = unity
lib_compat_mode = off   ; Benchkit says framework arduino; here the fake Arduino stands in
lib_ignore = Adafruit ST7735 and ST7789 Library, Adafruit GFX Library, Adafruit BusIO, RF24, Adafruit NeoPixel
build_flags = -std=c++11 -Wall -D ARDUINO=10800 -D NATIVE_TEST -I fakelib/fake_arduino/src
test_build_src = false
